<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Capital Allocator | 4 Accounts</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen flex flex-col items-center p-4 selection:bg-zinc-800">

  <main class="w-full max-w-md my-3 space-y-4">
    
    <!-- Header -->
    <header class="border-b border-zinc-900 pb-3 flex justify-between items-baseline">
      <div>
        <h1 class="text-[10px] font-bold uppercase tracking-[0.25em] text-zinc-500">ALLOCATION PROTOCOL</h1>
        <div class="text-xl font-extrabold tracking-tight text-white">MONEY TRACKER</div>
      </div>
      <div id="todayDate" class="mono text-xs text-zinc-500">Memuat tarikh...</div>
    </header>

    <!-- Status Harian Makan RHB (Had RM13.50/Hari & Simpan BSN) -->
    <section class="bg-zinc-950 border border-emerald-900/40 rounded-2xl p-4 space-y-2">
      <div class="flex justify-between items-center text-xs">
        <span class="mono uppercase font-bold text-emerald-400">RHB • MAKAN HARIAN</span>
        <span class="text-[11px] text-zinc-500">Had: RM 13.50 (Reset 12:00 AM)</span>
      </div>
      <div class="flex justify-between items-baseline">
        <div class="space-y-0.5">
          <span class="text-[10px] text-zinc-500 uppercase mono">Baki Makan Hari Ini</span>
          <div id="dailyFoodRemaining" class="text-3xl font-extrabold mono text-white">RM 13.50</div>
        </div>
        <div class="text-right">
          <span class="text-[10px] text-zinc-500 uppercase mono">Dah Guna</span>
          <div id="dailyFoodSpent" class="text-sm font-semibold mono text-zinc-400">RM 0.00</div>
        </div>
      </div>
      <div class="w-full h-1.5 bg-zinc-900 rounded-full overflow-hidden">
        <div id="dailyFoodBar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 100%;"></div>
      </div>

      <!-- Butang Manual Simpan Baki Makan ke BSN -->
      <div class="pt-2 flex justify-between items-center border-t border-zinc-900/80">
        <span class="text-[10px] text-zinc-500 mono">Tak habis belanja? Simpan baki:</span>
        <button onclick="transferRemainingToBSN()" class="px-2.5 py-1 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-[10px] mono text-emerald-400 rounded-lg font-bold transition">
          Pindah Baki Hari Ini ➔ BSN
        </button>
      </div>
    </section>

    <!-- 4 Kad Baki Akaun -->
    <div class="grid grid-cols-2 gap-2 text-xs mono">
      <!-- RHB -->
      <div class="bg-zinc-950 border border-zinc-900 p-3 rounded-xl space-y-1">
        <div class="text-[10px] text-zinc-500 uppercase flex justify-between">
          <span>RHB (Makan)</span>
        </div>
        <div id="bal-rhb" class="text-lg font-bold text-zinc-100">RM 0.00</div>
      </div>
      <!-- BIMB -->
      <div class="bg-zinc-950 border border-zinc-900 p-3 rounded-xl space-y-1">
        <div class="text-[10px] text-zinc-500 uppercase flex justify-between">
          <span>BIMB (Minyak)</span>
        </div>
        <div id="bal-bimb" class="text-lg font-bold text-zinc-100">RM 0.00</div>
      </div>
      <!-- BSN -->
      <div class="bg-zinc-950 border border-zinc-900 p-3 rounded-xl space-y-1">
        <div class="text-[10px] text-zinc-500 uppercase flex justify-between">
          <span>BSN (Simpanan/Kecemasan)</span>
        </div>
        <div id="bal-bsn" class="text-lg font-bold text-emerald-400">RM 0.00</div>
      </div>
      <!-- TNG -->
      <div class="bg-zinc-950 border border-zinc-900 p-3 rounded-xl space-y-1">
        <div class="text-[10px] text-zinc-500 uppercase flex justify-between">
          <span>TnG (Pelajaran)</span>
        </div>
        <div id="bal-tng" class="text-lg font-bold text-zinc-100">RM 0.00</div>
      </div>
    </div>

    <!-- Input Transaksi Tolak / Tambah -->
    <section class="bg-zinc-950 border border-zinc-900 rounded-2xl p-4 space-y-3">
      <div class="flex justify-between items-center text-xs">
        <span class="font-bold text-zinc-300 uppercase tracking-wider text-[11px]">Rekod Transaksi</span>
        <!-- Pilihan Tolak / Tambah -->
        <div class="flex bg-black p-0.5 rounded-lg border border-zinc-800 mono text-[11px]">
          <button id="btnTypeExpense" onclick="setTxnType('expense')" class="px-2.5 py-1 rounded bg-zinc-800 text-rose-400 font-bold">TOLAK (-)</button>
          <button id="btnTypeDeposit" onclick="setTxnType('deposit')" class="px-2.5 py-1 rounded text-zinc-500 hover:text-zinc-300 font-bold">TAMBAH (+)</button>
        </div>
      </div>

      <!-- Pilih Akaun -->
      <div class="grid grid-cols-4 gap-1.5 text-xs mono">
        <button type="button" onclick="selectAccount('rhb', this)" class="acc-btn p-2 rounded-lg border border-emerald-500 bg-zinc-900 text-emerald-400 font-bold">RHB</button>
        <button type="button" onclick="selectAccount('bimb', this)" class="acc-btn p-2 rounded-lg border border-zinc-800 bg-black text-zinc-400 font-bold">BIMB</button>
        <button type="button" onclick="selectAccount('bsn', this)" class="acc-btn p-2 rounded-lg border border-zinc-800 bg-black text-zinc-400 font-bold">BSN</button>
        <button type="button" onclick="selectAccount('tng', this)" class="acc-btn p-2 rounded-lg border border-zinc-800 bg-black text-zinc-400 font-bold">TnG</button>
      </div>

      <!-- Ruang Nilai & Catatan -->
      <div class="space-y-2">
        <div class="relative">
          <span class="absolute left-3 top-3 mono text-sm font-bold text-zinc-500">RM</span>
          <input type="number" step="0.10" id="txnAmount" placeholder="0.00" 
            class="w-full bg-black border border-zinc-800 rounded-xl py-2.5 pl-11 pr-3 text-base mono font-bold text-white focus:outline-none focus:border-zinc-500">
        </div>
        <input type="text" id="txnDesc" placeholder="Catatan (cth: Nasi bajet, RON95, print lab)..." 
          class="w-full bg-black border border-zinc-800 rounded-xl p-2.5 text-xs text-zinc-200 focus:outline-none focus:border-zinc-500 placeholder:
